name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # The site is plain static HTML in APCH/. 404.html uses root-absolute
      # paths, so prefix them with the Pages base path (e.g. /The-Apostles-Church).
      - name: Prepare site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir _site
          cp -r APCH/. _site/
          rm -rf _site/tools
          touch _site/.nojekyll
          sed -i -E "s#(href|src)=\"/#\1=\"${BASE_PATH}/#g" _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
